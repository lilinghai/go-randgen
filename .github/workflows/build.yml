name: Build
on:
  push:
    branches: [ tiflash ]
jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Build
      run: make build_image
    - name: Docker Login
      uses: docker/login-action@v1
      with:
        registry: hub.pingcap.net
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: Push
      run: make push_image
